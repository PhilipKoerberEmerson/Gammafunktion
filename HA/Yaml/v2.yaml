alias: PersonOderBewegungErkanntSteckdose2an1bis10min
description: Schaltet die Steckdose bei Personen- oder Bewegungserkennung für 1 bis 10 Minuten ein.

triggers:
  - trigger: motion.detected
    target:
      entity_id: binary_sensor.c510w_person_detection
    options:
      behavior: each
      for: "00:00:00"

  - trigger: motion.detected
    target:
      entity_id: binary_sensor.c510w_cell_motion_detection
    options:
      behavior: each
      for: "00:00:00"

conditions: []

actions:
  - action: switch.turn_on
    target:
      entity_id: switch.dach_shellysteckdose2_907069587390
    data: {}

  - delay:
      seconds: "{{ range(60, 601) | random }}"

  - action: switch.turn_off
    target:
      entity_id: switch.dach_shellysteckdose2_907069587390
    data: {}

mode: restart