# =============================================================================
# Kamera in Einfahrt: Steckdose 2 bei Dunkelheit für 1..10 Minuten einschalten
# -----------------------------------------------------------------------------
# Ablauf:
#   1. Kamera C510W meldet Person ODER Bewegung
#   2. Nur wenn es (nach Sonnenstand) dunkel genug ist
#   3. Steckdose EIN -> zufällige Wartezeit 1–10 min -> Steckdose AUS
#
# Hinweise:
#   - mode: restart  -> jede neue Erkennung während der Wartezeit startet die
#     Automation neu: Steckdose bleibt an, die Zufallszeit wird neu gewürfelt.
#     Dadurch verlängert sich die Einschaltzeit automatisch, solange Aktivität
#     erkannt wird.
#   - Bekannte Schwäche des "delay"-Musters: Wird Home Assistant während der
#     Wartezeit neu gestartet oder werden die Automationen neu geladen, bricht
#     der Lauf ab und die Steckdose bleibt AN. Wer das absichern will, nutzt
#     stattdessen einen Timer-Helfer (timer.start / timer.finished-Trigger).
# =============================================================================

alias: EinfahrtDunkelPersonOderBewegungSteckdose2an1bis10min
description: >-
  Schaltet Steckdose 2 (Dach) bei Personen- oder Bewegungserkennung der C510W
  für zufällig 1 bis 10 Minuten ein - nur zwischen Dämmerung und Morgengrauen.

triggers:
  # Beide Sensoren in EINEM Trigger. "behavior: each" ist Standard, d. h. jede
  # einzelne Erkennung löst aus. "for" entfällt (Standard 00:00:00 = sofort).
  # Voraussetzung: beide Sensoren haben die Geräteklasse "motion". Falls einer
  # z. B. "occupancy" ist, dort stattdessen einen state-Trigger (to: "on") nutzen.
  - trigger: motion.detected
    id: kamera_erkennung
    target:
      entity_id:
        - binary_sensor.c510w_person_detection
        - binary_sensor.c510w_cell_motion_detection

conditions:
  # Dunkel-Fenster: ab 1 h VOR Sonnenuntergang bis 1 h NACH Sonnenaufgang.
  # (Negativer Offset = früher, positiver Offset = später.)
  # Alternative für "wirklich dunkel": Sonnenstand prüfen, z. B.
  #   - condition: numeric_state
  #     entity_id: sun.sun
  #     attribute: elevation
  #     below: -4
  - condition: sun
    after: sunset
    after_offset: "-01:00:00"
    before: sunrise
    before_offset: "01:00:00"

actions:
  - alias: Steckdose einschalten
    action: switch.turn_on
    target:
      entity_id: switch.dach_shellysteckdose2_907069587390

  # range(60, 601) -> ganzzahlige Sekunden von 60 bis einschließlich 600.
  - alias: Zufällig 1 bis 10 Minuten warten
    delay:
      seconds: "{{ range(60, 601) | random }}"

  - alias: Steckdose ausschalten
    action: switch.turn_off
    target:
      entity_id: switch.dach_shellysteckdose2_907069587390

# restart: Neue Erkennung während der Wartezeit -> Lauf wird abgebrochen und
# sofort neu gestartet (Steckdose bleibt an, neue Zufallszeit).
mode: restart